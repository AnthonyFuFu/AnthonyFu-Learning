# 共用設定
spring:
  profiles:
    active: qas

  application:
    name: anthonyfu_learning

  security:
    user:
      name: admin
      password: 123456

  thymeleaf:
    prefix: classpath:/templates/
    cache: false

  web:
    resources:
      static-locations: classpath:/static/

  datasource:
    hikari:
      jdbc-url: jdbc:mysql://localhost:3306/anthonyfu_learning?serverTimezone=Asia/Taipei
      username: root
      password: 123456
      driver-class-name: com.mysql.cj.jdbc.Driver
      minimum-idle: 5
      maximum-pool-size: 20

      # idle-timeout: 300000
      # max-lifetime: 1800000
      # connection-timeout: 30000
      # validation-timeout: 5000
      # pool-name: HikariPool

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

  batch:
    job:
      enabled: false

  sql:
    init:
      mode: always

server:
  port: 8080

logging:
  level:
    org:
      hibernate: warn

app:
  base-url: ENC(IwaS3E8P9NygPrZF7Cs7CALzuFbqzP11o8TgCiB6qeLDDT9i3eboEp7EE2hbmQnxeOCnw46lsLFC3EYGLtErCg==)
